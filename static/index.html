<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Multi-Agent Orchestration Mesh</title>
    <style>
        :root {
            --bg-dark: #121824;
            --panel-dark: #1e293b;
            --text-light: #f8fafc;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }
        .header {
            padding: 20px;
            background-color: var(--panel-dark);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 16pt; font-weight: 600; }
        
        /* NEW: Metadata display wrapper */
        .session-metadata {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        .session-id-display {
            font-family: 'Consolas', monospace;
            font-size: 9pt;
            color: #38bdf8;
            background-color: #0c4a6e;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #0284c7;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 9pt;
            background-color: #475569;
            font-weight: bold;
        }
        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 15px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
        }
        .message.user {
            background-color: var(--accent-blue);
            align-self: flex-end;
        }
        .message.agent {
            background-color: var(--panel-dark);
            align-self: flex-start;
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .node-tag {
            font-size: 8pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #94a3b8;
        }
        .token-text {
            font-family: 'Consolas', monospace;
            font-size: 10pt;
            white-space: pre-wrap;
        }
        .input-area {
            padding: 20px;
            background-color: var(--panel-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-light);
            font-size: 11pt;
        }
        input[type="text"]:focus { outline: 1px solid var(--accent-blue); }
        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #2563eb; }
        .telemetry-panel {
            width: 350px;
            background-color: var(--panel-dark);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .telemetry-panel h2 { font-size: 12pt; margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .log-box {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 8.5pt;
            padding: 10px;
            overflow-y: auto;
            color: #a7f3d0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="chat-panel">
            <div class="header">
                <h1>Local Orchestration Mesh</h1>
                <div class="session-metadata">
                    <div id="graph-status" class="status-badge">IDLE</div>
                    <div id="session-key-box" style="display: none;" class="session-id-display">
                        Active Thread: <span id="active-thread-id">None</span>
                    </div>
                </div>
            </div>
            
            <div class="chat-history" id="chat-history"></div>
            
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Enter instructions for the agent network..." autocomplete="off">
                <button id="send-btn" onclick="submitPrompt()">Execute Loop</button>
            </div>
        </div>

        <div class="telemetry-panel">
            <h2>System Telemetry Logs</h2>
            <div class="log-box" id="log-box">=== Real-time SSE Events Stream ===&#10;</div>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const logBox = document.getElementById('log-box');
        const statusBadge = document.getElementById('graph-status');
        const sessionKeyBox = document.getElementById('session-key-box');
        const activeThreadIdSpan = document.getElementById('active-thread-id');

        function appendLog(text) {
            logBox.innerText += `${text}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function submitPrompt() {
            const inputField = document.getElementById('user-input');
            const prompt = inputField.value.trim();
            if (!prompt) return;

            inputField.value = '';
            chatHistory.innerHTML += `<div class="message user">${prompt}</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // 1. Generate the unique session string
            const threadId = `stream_web_${Date.now()}`;
            
            const agentMessageBlock = document.createElement('div');
            agentMessageBlock.className = 'message agent';
            agentMessageBlock.innerHTML = `<div class="node-tag" id="current-active-node">Initializing...</div><div class="token-text" id="stream-text-target"></div>`;
            chatHistory.appendChild(agentMessageBlock);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const nodeTag = document.getElementById('current-active-node');
            const textTarget = document.getElementById('stream-text-target');

            try {
                statusBadge.innerText = 'PROCESSING';
                statusBadge.style.backgroundColor = '#d97706';

                const response = await fetch('/agent/team-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: prompt, thread_id: threadId })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const rawJson = line.replace('data: ', '').trim();
                            try {
                                const data = JSON.parse(rawJson);
                                appendLog(`[EVENT] ${data.event} ${data.node ? `-> ${data.node}` : ''}`);

                                // ==========================================================
                                // EXPOSE STREAM METADATA ON GRAPH INITIALIZATION
                                // ==========================================================
                                if (data.event === 'GRAPH_START') {
                                    activeThreadIdSpan.innerText = data.thread_id;
                                    sessionKeyBox.style.display = 'block';
                                } else if (data.event === 'NODE_START') {
                                    nodeTag.innerText = `Active Peer Node: ${data.node}`;
                                } else if (data.event === 'TOKEN_STREAM') {
                                    textTarget.innerText += data.token;
                                    chatHistory.scrollTop = chatHistory.scrollHeight;
                                } else if (data.event === 'NODE_COMPLETE') {
                                    appendLog(`[SYSTEM] Finished processing node chunk: ${data.node}`);
                                }
                            } catch (e) {
                                // Skip anomalies
                            }
                        }
                    }
                }

                statusBadge.innerText = 'PAUSED / BREAKPOINT GATED';
                statusBadge.style.backgroundColor = '#b91c1c';

            } catch (err) {
                appendLog(`[CRITICAL ERROR] Execution failed: ${err.message}`);
                statusBadge.innerText = 'ERROR';
                statusBadge.style.backgroundColor = '#7f1d1d';
            }
        }
    </script>
</body>
</html>
